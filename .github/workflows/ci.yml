name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
