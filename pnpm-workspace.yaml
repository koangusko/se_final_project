packages:
  - apps/*
  - packages/*

# 所有依賴版本集中在這裡。package.json 只能寫 "catalog:"，不能自己寫版本號。
# 標註 exact 的套件刻意鎖死，升級前先看 docs/adr/0001-stack.md。
catalogMode: strict

catalog:
  # 前端
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  vite: ^8.3.8
  "@vitejs/plugin-react": ^6.3.0
  "@tanstack/react-router": ^1.170.46
  "@tanstack/router-plugin": ^1.169.0
  "@tanstack/router-cli": ^1.168.0
  "@tanstack/react-query": ^5.108.4
  tailwindcss: ^4.3.5
  "@tailwindcss/vite": ^4.3.5
  "@base-ui/react": ^1.9.0
  # exact：v6 API。不要換成 @dnd-kit/react（0.x，hook 同名但參數不同）
  "@dnd-kit/core": 6.3.1
  "@dnd-kit/modifiers": 9.0.0
  "@dnd-kit/utilities": 3.2.2
  # exact：Spark 對 three 版本敏感
  three: 0.187.0
  "@types/three": 0.187.0
  "@sparkjsdev/spark": 2.4.0

  # 後端
  hono: ^4.13.21
  "@hono/node-server": ^2.1.11
  "@hono/zod-validator": ^0.9.1
  zod: ^4.6.7
  # exact：不要用 v1 RC 或 RQB v2 的寫法
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  pg: ^8.23.1
  "@types/pg": ^8.23.1
  "@electric-sql/pglite": ^0.6.0

  # 工具
  typescript: ^7.0.2
  "@types/node": ^26.6.6
  oxlint: ~1.94.0
  oxlint-tsgolint: ^7.0.2008
  oxfmt: ~0.79.0
  vitest: ^5.1.1
  "@playwright/test": ^1.65.1

allowBuilds:
  esbuild: true
